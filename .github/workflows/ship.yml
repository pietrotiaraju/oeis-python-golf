name: ship

# Pushing a branch named add/... or golf/... lands it on main without a pull request,
# once tools/guard.py and tools/verify.py pass for the sequences it adds or changes.
# Only seq/, bfiles/ and README.md land this way; anything else needs a pull request.
on:
  push:
    branches: ["add/**", "golf/**"]

permissions:
  contents: write

jobs:
  ship:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          # The checks come from main, so a branch cannot loosen the rules it is checked by.
          git show origin/main:tools/land.sh > "$RUNNER_TEMP/land.sh"
          git show origin/main:tools/guard.py > "$RUNNER_TEMP/guard.py"
          GUARD="$RUNNER_TEMP/guard.py" bash "$RUNNER_TEMP/land.sh" "$GITHUB_REF_NAME"
